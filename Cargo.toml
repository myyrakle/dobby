[package]
name = "dobby"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["myyrakle <sssang97@naver.com>"]
description = "Local dev environment janitor: merged worktrees, build artifacts, package caches, docker"
keywords = ["cleanup", "gc", "worktree", "cache", "mcp"]
include = ["src/*", "Cargo.toml"]
readme = "README.md"
repository = "https://github.com/myyrakle/dobby"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
